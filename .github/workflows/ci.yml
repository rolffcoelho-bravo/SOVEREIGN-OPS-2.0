name: G0 verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest --junitxml=test-results.xml
      - run: uv run --locked python scripts/smoke_http.py
      - run: uv run --locked python scripts/check_secrets.py
      - run: uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file audit-requirements.txt
      - run: uv run --locked pip-audit --requirement audit-requirements.txt --disable-pip --no-deps --strict --progress-spinner off --cache-dir .cache/pip-audit
