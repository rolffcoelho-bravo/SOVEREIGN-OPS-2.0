[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "shockbridge-sovereign-ops"
version = "0.1.0"
description = "Domain-aware reliability and abstention for mission-critical telemetry"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [
  { name = "Rodolfo Pereira", email = "research@shockbridgepulse.com" },
]
keywords = [
  "anomaly-detection",
  "reliability",
  "abstention",
  "telemetry",
  "spacecraft",
  "wind-turbine",
  "scada",
  "mission-critical",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "openpyxl>=3.1.5,<4",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "tzdata>=2026.2,<2028",
  "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://shockbridgepulse.com"
Repository = "https://github.com/rolffcoelho-bravo/sovereign-ops-2.0"
Documentation = "https://github.com/rolffcoelho-bravo/sovereign-ops-2.0/tree/main/docs"
Issues = "https://github.com/rolffcoelho-bravo/sovereign-ops-2.0/issues"

[dependency-groups]
dev = [
  "detect-secrets==1.5.0",
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]  # S311: random in tests is for statistical fixtures, not crypto
"src/sovereign_ops/statistics.py" = ["S311"]  # random used for statistical bootstrap, not crypto

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
